document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <h3 style=\"font-family:'Outfit';font-size:17px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Certificaciones<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.7;color:#3A4657\"><b>BPA certificado<\u002Fb> · Importador autorizado por DIGEMID.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #0FA36B;border-radius:24px;padding:22px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:17px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Misión<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.7;color:#3A4657\">Acercar medicamentos innovadores a nuestros pacientes<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsection>\n\n  <section id=\"regulatorio\" style=\"scroll-margin-top:92px;background:#F1F6FC;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B;margin-bottom:10px\">02 · Capacidades regulatorias<\u002Fp>\n      <h2 style=\"font-family:'Outfit';font-size:42px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:36px;max-width:760px;text-wrap:pretty\">Soporte regulatorio integral, del dossier al acceso al mercado<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:26px 24px\">\n          <span style=\"display:inline-block;font-family:'Outfit';font-size:13px;font-weight:600;color:#0FA36B;margin-bottom:10px\">01<\u002Fspan>\n          <h3 style=\"font-family:'Outfit';font-size:19px;font-weight:700;color:#0B1F4B;margin-bottom:10px\">Registro sanitario<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#3A4657\"><br><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:26px 24px\">\n          <span style=\"display:inline-block;font-family:'Outfit';font-size:13px;font-weight:600;color:#0FA36B;margin-bottom:10px\">02<\u002Fspan>\n          <h3 style=\"font-family:'Outfit';font-size:19px;font-weight:700;color:#0B1F4B;margin-bottom:10px\">Permisos de importación y aduanas<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#3A4657\"><br><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:26px 24px\">\n          <span style=\"display:inline-block;font-family:'Outfit';font-size:13px;font-weight:600;color:#0FA36B;margin-bottom:10px\">03<\u002Fspan>\n          <h3 style=\"font-family:'Outfit';font-size:19px;font-weight:700;color:#0B1F4B;margin-bottom:10px\">Farmacovigilancia y post-comercialización<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#3A4657\"><br><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:26px 24px\">\n          <span style=\"display:inline-block;font-family:'Outfit';font-size:13px;font-weight:600;color:#0FA36B;margin-bottom:10px\">04<\u002Fspan>\n          <h3 style=\"font-family:'Outfit';font-size:19px;font-weight:700;color:#0B1F4B;margin-bottom:10px\">Rotulado y adaptación local<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.75;color:#3A4657\"><br><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"logistica\" style=\"scroll-margin-top:92px;background:#fff;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B;margin-bottom:10px\">03 · Logística y almacenamiento<\u002Fp>\n      <h2 style=\"font-family:'Outfit';font-size:42px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:36px\">Infraestructur 02Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#F1F6FC;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px\"><p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B\">04 · Propuesta de valor<\u002Fp><\u002Fdiv>\n      <h2 style=\"font-family:'Outfit';font-size:42px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:36px;max-width:760px;text-wrap:pretty\">Por qué los fabricantes líderes eligen PharmaCo Importers<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px\">\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Expertise regulatorio<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Tecnología aplicada a procesos regulatorios y logística<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Gestión del producto<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Alcance comercial<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Mitigación de riesgos<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:24px\">\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:8px\">Alianza de largo plazo<\u002Fh3>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"alianzas\" style=\"scroll-margin-top:92px;background:#fff;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B;margin-bottom:10px\">05 · Modelos de alianza — Perú<\u002Fp>\n      <h2 style=\"font-family:'Outfit';font-size:42px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:36px\">Tres formas de trabajar juntos.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px\">\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #0B1F4B;border-radius:24px;padding:26px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:21px;font-weight:700;color:#0B1F4B;margin-bottom:14px\">Distribuidor exclusivo<\u002Fh3>\n          <ul style=\"display:grid;gap:9px\">\n            \n            \n            \n            \n            \n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #0FA36B;border-radius:24px;padding:26px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:21px;font-weight:700;color:#0B1F4B;margin-bottom:14px\">Importador no exclusivo<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #7DE3B0;border-radius:24px;padding:26px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:21px;font-weight:700;color:#0B1F4B;margin-bottom:14px\">Agente regulatorio y logístico<\u002Fh3>\n          <ul style=\"display:grid;gap:9px\">\n            \n            \n            \n            \n            \n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;color:#3A4657;margin-top:22px;padding:14px 18px;background:#E7F5EF;border-radius:20px;line-height:1.7\">Todos los modelos son personalizables. Conversemos sobre el esquema que mejor se ajuste a los objetivos y a la estrategia de mercado de su compañía.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#F1F6FC;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B;margin-bottom:10px\">06 · Próximos pasos<\u002Fp>\n      <h2 style=\"font-family:'Outfit';font-size:42px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:36px\">Empecemos. Paso a paso.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px\">\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0FA36B;margin-bottom:8px\">Semana 1–2<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Reunión inicial<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0FA36B;margin-bottom:8px\">Semana 3–4<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F elative;overflow:hidden\">\n    <div style=\"position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,0.05)\"><\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:8px\"><a href=\"#inicio\" style=\"color:rgba(255,255,255,0.6)\">Inicio<\u002Fa> › Farmacovigilancia<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px\"><h2 style=\"font-family:'Outfit';font-size:36px;font-weight:800;letter-spacing:-0.015em\">Farmacovigilancia<\u002Fh2><\u002Fdiv>\n      <p style=\"font-size:14px;color:rgba(255,255,255,0.82);max-width:620px\">Detección, identificación y evaluación de sospechas de reacciones adversas a medicamentos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))\">\n    <div style=\"background:#fff;padding:36px 40px\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #0FA36B\">Formulario de notificación<\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px;background:#F1F6FC;padding:10px 14px;border-radius:16px;border:1px solid #D8E3F2\">\n        <label for=\"asunto\" style=\"font-size:13px;font-weight:600;color:#0B1F4B;white-space:nowrap\">Asunto<\u002Flabel>\n        <sc-raw-select id=\"asunto\" style=\"flex:1;padding:7px 10px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';background:#fff;color:#1A2438\">\n          <option value=\"\">Seleccione un asunto<\u002Foption>\n          <option value=\"ram\">Reacción adversa a medicamento<\u002Foption>\n          <option value=\"error\">Error de medicación<\u002Foption>\n          <option value=\"calidad\">Problema de calidad<\u002Foption>\n          <option value=\"consulta\">Consulta general<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n\n      \n      <div style=\"font-size: 13px; font-weight: 600; color: #122BA0; margin: 20px 0 12px; padding: 6px 10px; background: #E7F5EF; border-left: 3px solid #0FA36B; border-radius: 0 4px 4px 0\">Datos del notificador<\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"nombres\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Nombres *<\u002Flabel>\n          <input type=\"text\" id=\"nombres\" placeholder=\"Escribe tus nombres\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"apellidos\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Apellidos *<\u002Flabel>\n          <input type=\"text\" id=\"apellidos\" placeholder=\"Escribe tus apellidos\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:14px\">\n        <label for=\"email\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Correo electrónico *<\u002Flabel>\n        <input type=\"email\" id=\"email\" placeholder=\"correo@ejemplo.com\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n      <\u002Fdiv>\n\n      <div style=\"font-size: 13px; font-weight: 600; color: #122BA0; margin: 20px 0 12px; padding: 6px 10px; background: #E7F5EF; border-left: 3px solid #0FA36B; border-radius: 0 4px 4px 0\">Datos del paciente<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"pac_iniciales\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Iniciales del paciente *<\u002Flabel>\n          <input type=\"text\" id=\"pac_iniciales\" placeholder=\"Ej. J.P.R.\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"pac_sexo\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Sexo<\u002Flabel>\n          <sc-raw-select id=\"pac_sexo\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n            <option value=\"\">Seleccione<\u002Foption>\n            <option value=\"f\">Femenino<\u002Foption>\n            <option value=\"m\">Masculino<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"telefono\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Teléfono de contacto *<\u002Flabel>\n          <input type=\"tel\" id=\"telefono\" placeholder=\"+51 999 000 000\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"edad\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Edad<\u002Flabel>\n          <input type=\"number\" id=\"edad\" place os efectos adversos y de cualquier otro problema relacionado con los medicamentos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">¿Por qué es importante?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Permite vigilar los efectos adversos de los medicamentos en el paciente, controlar el cumplimiento de la prescripción y generar oportunidades de mejora para que el tratamiento cumpla su función.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">¿Qué es un evento adverso?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Cualquier suceso médico desafortunado que pueda presentarse durante el tratamiento con un medicamento, pero que no necesariamente tiene relación causal con él.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">¿Qué es una reacción adversa?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Reacción nociva y no deseada que se presenta tras la administración de un fármaco a las dosis utilizadas habitualmente en el ser humano para prevenir, diagnosticar o tratar una enfermedad.<\u002Fp>\n      <\u002Fdiv>\n      \n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\ ct manager &amp; sales team<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Joint marketing investment &amp; co-branding<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Regulatory ownership &amp; liability<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Annual sales targets &amp; business review<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #0FA36B;border-radius:24px;padding:26px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:21px;font-weight:700;color:#0B1F4B;margin-bottom:14px\">Non-exclusive importer<\u002Fh3>\n          <ul style=\"display:grid;gap:9px\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Import and distribution without exclusivity<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Flexible territory agreements<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Regulatory support on request<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Access to the existing distribution network<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Ideal for market entry and pilot phase<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:#F1F6FC;border:1px solid #D8E3F2;border-top:3px solid #7DE3B0;border-radius:24px;padding:26px 24px\">\n          <h3 style=\"font-family:'Outfit';font-size:21px;font-weight:700;color:#0B1F4B;margin-bottom:14px\">Regulatory &amp; logistics agent<\u002Fh3>\n          <ul style=\"display:grid;gap:9px\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Registration &amp; renewal management only<\u002Fli>\n            <li style=\"font-size:14px;line-height:1.6;color:#3A4657\">Warehousing &amp; distribution services<\u002Fli>\n 00;color:#0B1F4B;margin-bottom:6px\">Due diligence<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0FA36B;margin-bottom:8px\">Month 2<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Term sheet<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0FA36B;margin-bottom:8px\">Month 3<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Legal agreement<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D8E3F2;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0FA36B;margin-bottom:8px\">Month 3–6<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Regulatory filing<\u002Fh3>\n          \n        <\u002Fdiv>\n        <div style=\"background:#0B1F4B;border:1px solid #0B1F4B;border-radius:24px;padding:22px\">\n          <p style=\"font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7DE3B0;margin-bottom:8px\">Health authority timeline<\u002Fp>\n          <h3 style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#fff;margin-bottom:6px\">Commercial launch<\u002Fh3>\n          <p style=\"font-size:13px;line-height:1.7;color:rgba(255,255,255,0.8)\">Market introduction, training and sales execution.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div id=\"pharmacovigilance\" style=\"scroll-margin-top:92px;background:linear-gradient(135deg,#0B1F4B 0%,#0E9E7A 100%);padding:36px 40px;color:#fff;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,0.05)\"><\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;position:relative\">\n      <p style=\"font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:8px\"><a href=\"#home\" style=\"color:rgba(255,255,255,0.6)\">Home<\u002Fa> › Pharmacovigilance<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px\"><h2 style=\"font-family:'Outfit';font-size:36px;font-weight:800;letter-spacing:-0.015em\">Pharmacovigilance<\u002Fh2><\u002Fdiv>\n      <p style=\"font-size:14px;color:rgba(255,255,255,0.82);max-width:620px\">Detection, identification and assessment of suspected adverse drug reactions.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))\">\n    <div style=\"background:#fff;padding:36px 40px\">\n      <div style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #0FA36B\">Reporting form<\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px;background:#F1F6FC;padding:10px 14px;border-radius:16px;border:1px solid #D8E3F2\">\n        <label for=\"subject_en\" style=\"font-size:13px;font-weight:600;color:#0B1F4B;white-space:nowrap\">Subject<\u002Flabel>\n        <sc-raw-select id=\"subject_en\" style=\"flex:1;padding:7px 10px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';background:#fff;color:#1A2438\">\n          <option value=\"\">Select a subject<\u002Foption>\n          <option value=\"adr\">Adverse drug reaction<\u002Foption>\n          <option value=\"error\">Medication error<\u002Foption>\n          <option value=\"quality\">Product quality issue<\u002Foption>\n          <option value=\"general\">General enquiry<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n\n      <div style=\"font-size:13px;font-weight:600;color:#0FA36B;margin:20px 0 12px;padding:6px 10px;background:#E7F5EF;border-left:3px solid #0FA36B;border-radius:0 4px 4px 0\">Reporter details<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"first_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">First name *<\u002Flabel>\n          <input type=\"text\" id=\"first_en\" placeholder=\"Your first name\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"last_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Last name *<\u002Flabel>\n          <input type=\"text\" id=\"last_en\" placeholder=\"Your last name\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:14px\">\n        <label for=\"email_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Email *<\u002Flabel>\n        <input type=\"email\" id=\"email_en\" placeholder=\"name@example.com\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n      <\u002Fdiv>\n\n      <div style=\"font-size:13px;font-weight:600;color:#0FA36B;margin:20px 0 12px;padding:6px 10px;background:#E7F5EF;border-left:3px solid #0FA36B;border-radius:0 4px 4px 0\">Patient details<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"initials_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Patient initials *<\u002Flabel>\n          <input type=\"text\" id=\"initials_en\" placeholder=\"e.g. J.P.R.\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"sex_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Sex<\u002Flabel>\n          <sc-raw-select id=\"sex_en\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n            <option value=\"\">Select<\u002Foption>\n            <option value=\"f\">Female<\u002Foption>\n            <option value=\"m\">Male<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"phone_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Contact phone *<\u002Flabel>\n          <input type=\"tel\" id=\"phone_en\" placeholder=\"+51 999 000 000\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"age_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Age<\u002Flabel>\n          <input type=\"number\" id=\"age_en\" placeholder=\"Years\" min=\"0\" max=\"120\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"margin-bottom:14px\">\n          <label for=\"drug_date_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Treatment start date<\u002Flabel>\n          <input type=\"date\" id=\"drug_date_en\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\">\n          <label for=\"event_date_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Event onset date<\u002Flabel>\n          <input type=\"date\" id=\"event_date_en\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:14px\">\n        <label for=\"product_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Suspected product *<\u002Flabel>\n        <input type=\"text\" id=\"product_en\" placeholder=\"Name, dose and batch if known\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff\">\n      <\u002Fdiv>\n      <div style=\"margin-bottom:14px\">\n        <label for=\"desc_en\" style=\"display:block;font-size:12px;color:#566277;margin-bottom:5px;font-weight:500\">Description of the adverse event *<\u002Flabel>\n        <textarea id=\"desc_en\" placeholder=\"Please describe the adverse event in detail...\" style=\"width:100%;padding:9px 11px;border:1px solid #C6D5E8;border-radius:12px;font-size:13px;font-family:'DM Sans';color:#1A2438;background:#fff;resize:vertical;min-height:90px\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:13px;color:#566277\">\n        <input type=\"checkbox\" id=\"terms_en\" style=\"accent-color:#0FA36B;width:16px;height:16px;cursor:pointer\">\n        <label for=\"terms_en\">I accept the terms and the processing of my data<\u002Flabel>\n      <\u002Fdiv>\n      <p style=\"font-size:11px;color:#8391A6;margin-bottom:18px;line-height:1.6;padding:8px 10px;background:#F8FBFF;border-radius:12px;border:1px solid #E3ECF8\">The information you provide is strictly confidential and is used solely for pharmacovigilance purposes.<\u002Fp>\n      <button sc-camel-on-click=\"{{ submit }}\" style=\"background:#0FA36B;color:#fff;border:none;padding:13px 0;border-radius:999px;font-size:14px;font-family:'Outfit';font-weight:600;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:.12em\" style-hover=\"background:#0B1F4B\">Submit report<\u002Fbutton>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin-top:14px;font-size:13px;color:#0B1F4B;background:#E7F5EF;border:1px solid #7DE3B0;border-radius:16px;padding:12px 14px;line-height:1.6\">Thank you. Your report has been registered and will be assessed by our pharmacovigilance unit.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#F1F6FC;padding:36px 40px\">\n      <div style=\"font-family:'Outfit';font-size:18px;font-weight:700;color:#0B1F4B;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #0FA36B\">About pharmacovigilance<\u002Fdiv>\n\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">What is it?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">The science and activities relating to the detection, assessment and prevention of adverse effects and any other problem related to medicines.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Why does it matter?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">It monitors the adverse effects of medicines in patients, lets the prescriber verify treatment adherence and creates improvement opportunities so therapy delivers its intended benefit.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">What is an adverse event?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Any untoward medical occurrence that may appear during treatment with a medicine but does not necessarily have a causal relationship with it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">What is an adverse reaction?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">A noxious and unintended response occurring after administration of a drug at doses normally used in humans to prevent, diagnose or treat disease.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Who can report?<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Physicians, pharmacists, other healthcare professionals, patients and their relatives.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Where to report<\u002Fh3>\n        <p style=\"font-size:13px;color:#3A4657;line-height:1.7\">Use the form on this page or write to our pharmacovigilance unit:<\u002Fp>\n        <a href=\"mailto:asuntosregulatorioscorp@gmail.com\" style=\"display:inline-block;margin-top:8px;background:#E7F5EF;color:#0B1F4B;font-size:12px;font-weight:600;padding:6px 10px;border-radius:12px;border:1px solid #7DE3B0\">asuntosregulatorioscorp@gmail.com<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">What should be reported?<\u002Fh3>\n        <ul style=\"font-size:13px;color:#3A4657;line-height:1.7;display:grid;gap:3px;padding-left:16px;list-style:disc\">\n          <li>Adverse events or reactions, whether or not described in the insert.<\u002Fli>\n          <li>Medication errors.<\u002Fli>\n          <li>Incorrect use of a medicine.<\u002Fli>\n          <li>Quality defects in a pharmaceutical product.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #D8E3F2;border-left:3px solid #0FA36B\">\n        <h3 style=\"font-family:'Outfit';font-size:16px;font-weight:700;color:#0B1F4B;margin-bottom:6px\">Essential information<\u002Fh3>\n        <ul style=\"font-size:13px;color:#3A4657;line-height:1.7;display:grid;gap:3px;padding-left:16px;list-style:disc\">\n          <li>Patient identification: initials, age and sex.<\u002Fli>\n          <li>Onset date of the adverse event.<\u002Fli>\n          <li>Description of the adverse event.<\u002Fli>\n          <li>Medicine: name, dose and duration of treatment.<\u002Fli>\n          <li>Source of information: physician, pharmacist, patient or relative.<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin-top:10px;font-size:12px;color:#8391A6;line-height:1.6;border-top:1px solid #D8E3F2;padding-top:10px\">The information provided is strictly confidential and used exclusively for pharmacovigilance purposes, in compliance with applicable data protection and health regulations.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"contact\" style=\"scroll-margin-top:92px;background:#fff;padding:72px 40px\">\n    <div style=\"max-width:1180px;margin:0 auto;position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;align-items:start\">\n      <div>\n        <p style=\"font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0FA36B;margin-bottom:10px\">Contact<\u002Fp>\n        <h2 style=\"font-family:'Outfit';font-size:38px;font-weight:800;letter-spacing:-0.015em;color:#0B1F4B;margin-bottom:14px;text-wrap:pretty\">We look forward to exploring a partnership that brings innovative medicines to patients across Latin America.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:14px\">\n        <div style=\"border-left:3px solid #0FA36B;padding-left:14px\">\n          <p style=\"font-size:12px;color:#8391A6;margin-bottom:3px\">Email<\u002Fp>\n          <a href=\"mailto:asuntosregulatorioscorp@gmail.com\" style=\"font-size:15px;color:#0B1F4B;font-weight:500\">asuntosregulatorioscorp@gmail.com<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #0FA36B;padding-left:14px\">\n          <p style=\"font-size:12px;color:#8391A6;margin-bottom:3px\">Phone<\u002Fp>\n          <a href=\"tel:+51987495573\" style=\"font-size:15px;color:#0B1F4B;font-weight:500\">+51 1 987 495 573<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #0FA36B;padding-left:14px\">\n          <p style=\"font-size:12px;color:#8391A6;margin-bottom:3px\">Address<\u002Fp>\n          <p style=\"font-size:15px;color:#0B1F4B;font-weight:500;line-height:1.6\">Av. 2 de Mayo N° 516 Int. 201<br>Lima — Peru<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0B1F4B;color:rgba(255,255,255,0.75);padding:36px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px\">\n    <div>\n      <strong style=\"display:block;color:#fff;font-family:'Outfit';font-size:17px;letter-spacing:.14em;margin-bottom:8px\">PHARMACO IMPORTERS<\u002Fstrong>\n      <p style=\"font-size:12px;line-height:1.7\">PharmaCo Importers<br>Av. 2 de Mayo N° 516 Int. 201<br>Lima — Peru<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h4 style=\"color:#fff;font-family:'Outfit';font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.15)\">Contact<\u002Fh4>\n      <ul style=\"display:grid;gap:6px\">\n        <li style=\"font-size:12px\"><a href=\"tel:+51987495573\" style=\"color:rgba(255,255,255,0.7)\">+51 1 987 495 573<\u002Fa><\u002Fli>\n        <li style=\"font-size:12px\"><a href=\"mailto:asuntosregulatorioscorp@gmail.com\" style=\"color:rgba(255,255,255,0.7)\">asuntosregulatorioscorp@gmail.com<\u002Fa><\u002Fli>\n        <li style=\"font-size:12px\"><a href=\"#pharmacovigilance\" style=\"color:rgba(255,255,255,0.7)\">Report an adverse event<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <h4 style=\"color:#fff;font-family:'Outfit';font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.15)\">Useful links<\u002Fh4>\n      <ul style=\"display:grid;gap:6px\">\n        \n        <li style=\"font-size:12px\"><a href=\"http://www.digemid.minsa.gob.pe/\" target=\"_blank\" style=\"color:rgba(255,255,255,0.7)\">DIGEMID (Peru)<\u002Fa><\u002Fli>\n        <li style=\"font-size:12px\"><a href=\"https://www.invima.gov.co/\" target=\"_blank\" style=\"color:rgba(255,255,255,0.7)\">INVIMA (Colombia)<\u002Fa><\u002Fli>\n        <li style=\"font-size:12px\"><a href=\"https://www.agemed.gob.bo/\" target=\"_blank\" style=\"color:rgba(255,255,255,0.7)\">AGEMED (Bolivia)<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <div style=\"background:#061539;text-align:center;color:rgba(255,255,255,0.42);font-size:11px;padding:13px 40px\">© PharmaCo Importers All rights reserved.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showFab }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:10px\">\n  <sc-if value=\"{{ tip }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;color:#1A2438;font-size:13px;line-height:1.5;padding:10px 14px;border-radius:20px;border:1px solid #7DE3B0;box-shadow:0 4px 16px rgba(11,31,75,0.15);max-width:210px;text-align:center\">{{ tipText }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <a href=\"{{ fabHref }}\" sc-camel-on-click=\"{{ hideTip }}\" style=\"display:flex;align-items:center;gap:10px;background:#0FA36B;color:#fff;border-radius:50px;padding:14px 22px;font-family:'Outfit';font-size:14px;font-weight:600;white-space:nowrap;animation:pcPulse 2.4s infinite\" style-hover=\"background:#0B1F4B;color:#fff\">\n    <span style=\"display:inline-flex;align-items:center\">\n      <svg width=\"22\" height=\"20\" sc-camel-view-box=\"0 0 100 90\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <polygon points=\"50,4 96,86 4,86\" fill=\"none\" stroke=\"white\" stroke-width=\"9\" stroke-linejoin=\"round\"><\u002Fpolygon>\n        <text x=\"50\" y=\"76\" text-anchor=\"middle\" font-size=\"52\" font-weight=\"bold\" fill=\"white\" font-family=\"Arial\">!<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fspan>\n    {{ fabLabel }}\n  <\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;es&quot;,&quot;en&quot;],&quot;default&quot;:&quot;es&quot;,&quot;tsType&quot;:&quot;'es' | 'en'&quot;,&quot;section&quot;:&quot;Contenido&quot;},&quot;showFab&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: null, sent: false, tip: false };\n\n  componentDidMount() {\n    this.timer = setTimeout(() => this.setState({ tip: true }), 2200);\n    this.timer2 = setTimeout(() => this.setState({ tip: false }), 8000);\n  }\n  componentWillUnmount() { clearTimeout(this.timer); clearTimeout(this.timer2); }\n\n  lang() { return this.state.lang || this.props.defaultLang || 'es'; }\n\n  renderVals() {\n    const lang = this.lang();\n    const es = lang === 'es';\n    return {\n      isEs: es,\n      isEn: !es,\n      sent: this.state.sent,\n      tip: this.state.tip,\n      showFab: this.props.showFab !== false,\n      fabHref: es ? '#farmacovigilancia' : '#pharmacovigilance',\n      fabLabel: es ? 'Reportar RAM' : 'Report an ADR',\n      tipText: es ? '¿Un medicamento le causó daño? Repórtelo ahora.' : 'Did a medicine harm you? Report it now.',\n      setEs: () => this.setState({ lang: 'es' }),\n      setEn: () => this.setState({ lang: 'en' }),\n      hideTip: () => this.setState({ tip: false }),\n      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
